[package]
name = "openhid-agent"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
authors.workspace = true
description = "OpenHID background agent — headless, always-on owner of the input hook, HID++ device I/O, and (later) the menu-bar tray."
# Distributed as a login-item helper inside the bundled .app; never published.
publish = false

[[bin]]
name = "openhid-agent"
path = "src/main.rs"

# Hardware-free mock agent for GUI development: serves a scripted inventory over
# the real IPC socket. Dev-only — xtask bundles `openhid-agent` by exact path,
# so this binary never ships.
[[bin]]
name = "openhid-agent-mock"
path = "src/bin/mock_agent.rs"

[dependencies]
openhid-agent-core = { path = "../openhid-agent-core" }
openhid-core = { path = "../openhid-core", features = ["logging", "worker"] }
openhid-device = { path = "../openhid-device" }
openhid-fixture = { workspace = true }
openhid-hid = { path = "../openhid-hid" }
openhid-hook = { path = "../openhid-hook" }
openhid-ipc = { path = "../openhid-ipc" }
serde_json.workspace = true
tarpc = { workspace = true }
interprocess = { workspace = true }
tokio = { workspace = true, features = ["rt-multi-thread", "net", "io-util", "signal"] }
futures = "0.3"
rust-i18n = "4"
tracing = { workspace = true }
tracing-subscriber = { workspace = true }
sysinfo = { version = "0.38.4", default-features = false, features = ["system"] }
opener = { workspace = true }
succession = { version = "0.2", features = ["supervision", "eviction"] }
tracing-appender = "0.2.5"

# Held at the version Cargo.lock already has for gpui's own build-dependency;
# bumping it independently would move the pinned gpui rev.
[build-dependencies]
embed-resource = "3.0.9"

# Small native tray bitmaps; shared between Windows and macOS, no GUI runtime.
[target.'cfg(any(target_os = "macos", target_os = "windows"))'.dependencies]
png = "0.18.1"

[target.'cfg(target_os = "macos")'.dependencies]
dispatch2 = { workspace = true }
libc = "0.2"
objc2 = { workspace = true }
objc2-app-kit = { workspace = true, features = ["NSStatusBar", "NSStatusItem", "NSStatusBarButton", "NSButton", "NSControl", "NSResponder", "NSView", "NSMenu", "NSMenuItem", "NSImage", "NSApplication", "NSRunningApplication", "NSWorkspace"] }
objc2-core-foundation = { workspace = true, features = ["CFBase", "CFDictionary", "CFNumber", "CFString"] }
objc2-core-graphics = { workspace = true, features = ["CGSession"] }
objc2-foundation = { workspace = true, features = ["NSString", "NSData", "NSArray", "NSNotification"] }
objc2-io-kit = { workspace = true }
objc2-security = { workspace = true, features = ["AuthSession"] }
openhid-inject = { path = "../openhid-inject" }

[target.'cfg(target_os = "linux")'.dependencies]
zbus = "5"

[target.'cfg(target_os = "windows")'.dependencies]
winreg = "0.56"
windows-sys = { workspace = true, features = [
    "Win32_Foundation",
    "Win32_Graphics_Gdi",
    "Win32_System_LibraryLoader",
    "Win32_System_Power",
    "Win32_UI_Shell",
    "Win32_UI_WindowsAndMessaging",
] }

[lints]
workspace = true

[dev-dependencies]
openhid-fixture = { workspace = true, features = ["fs"] }
tempfile = "3.27.0"
tokio = { workspace = true, features = ["test-util"] }
