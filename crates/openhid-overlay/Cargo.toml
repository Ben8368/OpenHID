[package]
name = "openhid-overlay"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
authors.workspace = true
description = "OpenHID Actions Ring overlay — the cursor-centred radial menu, a pure IPC client of the agent."
# Distributed as a login-item helper inside the bundled .app; never published.
publish = false

[[bin]]
name = "openhid-overlay"
path = "src/main.rs"

[dependencies]
openhid-core = { path = "../openhid-core", features = ["logging", "worker"] }
openhid-hook = { path = "../openhid-hook" }
openhid-ipc = { path = "../openhid-ipc" }
openhid-ui = { path = "../openhid-ui" }
anyhow = { workspace = true }
gpui = { workspace = true }
gpui_platform = { workspace = true }
rust-i18n = "4"
succession = "0.2"
tarpc = { workspace = true }
tokio = { workspace = true }
tracing = { workspace = true }

[dev-dependencies]
# An in-memory agent, and a paused clock, for the observation loop's tests.
openhid-ipc = { path = "../openhid-ipc", features = ["test-support"] }
tokio = { workspace = true, features = ["test-util"] }
# A headless app, for the windows an indicator opens and closes.
gpui = { workspace = true, features = ["test-support"] }

[build-dependencies]
embed-resource = "3.0.9"

[target.'cfg(target_os = "macos")'.dependencies]
# CGGetActiveDisplayList/CGDisplayBounds: placing the ring on the cursor's
# display needs global display bounds, which GPUI's display API doesn't expose
# (its bounds are display-relative). C FFI, so core-graphics.
core-graphics = { workspace = true }
objc2 = { workspace = true }
# NSScreen: the notice sits above the Dock, so it needs each screen's visible frame.
objc2-app-kit = { workspace = true, features = ["NSApplication", "NSResponder", "NSWindow", "NSEvent", "NSScreen", "block2"] }
# NSEvent global-monitor handlers are ObjC blocks (click-away dismissal).
block2 = { workspace = true }

[target.'cfg(target_os = "windows")'.dependencies]
raw-window-handle = "0.6"
windows-sys = { workspace = true, features = ["Win32_Foundation", "Win32_Graphics_Gdi", "Win32_UI_HiDpi", "Win32_UI_WindowsAndMessaging"] }

[lints]
workspace = true
