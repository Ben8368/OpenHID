[package]
publish = false
name = "openhid-ipc"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
authors.workspace = true
description = "The tarpc contract and local-socket transport shared by the OpenHID agent and GUI."

[features]
# In-memory agents for client tests; see the `testing` module.
test-support = ["dep:futures-lite"]

[dependencies]
openhid-core = { path = "../openhid-core", version = "0.8.14" }
bincode-next = { workspace = true }
bytes = { workspace = true }
serde = { workspace = true }
thiserror = { workspace = true }
tarpc = { workspace = true }
tokio = { workspace = true }
interprocess = { workspace = true }
succession = { version = "0.2", features = ["serde"] }
futures-lite = { workspace = true, optional = true }

[lints]
workspace = true

[dev-dependencies]
futures-lite = { workspace = true }
tokio = { workspace = true, features = ["test-util"] }
