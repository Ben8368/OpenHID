# The shared F87 output-action catalog owns the keyboard, consumer and
# modifier slot encodings used by desktop and CLI editors.
id: core-aula-keymap-output-owner
language: rust
severity: error
message: Use `aula_keymap_action_output(s)` from openhid-core instead of duplicating an AULA keymap action encoding.
files:
  - crates/**/*.rs
ignores:
  - crates/openhid-core/src/hid/aula/keymap_actions.rs
  - crates/openhid-core/src/hid/aula/oem_profile.rs
  - "**/tests.rs"
rule:
  any:
    - pattern: "output($NAME, $LABEL, [0, 0, 0, $USAGE])"
    - pattern: "output($NAME, $LABEL, [0x02, 0, 0, $USAGE])"
    - pattern: "output($NAME, $LABEL, [0, $MODIFIER, 0, 0])"
    - pattern: "modified_keyboard_usage($USAGE, $MODIFIERS)"
    - pattern: "($LABEL, [0, 0, 0, $USAGE])"
    - pattern: "($LABEL, [0x02, 0, 0, $USAGE])"
    - pattern: "($LABEL, [0, $MODIFIER, 0, 0])"
