# cargo-deny configuration — advisories, licenses, and source hygiene.
#
# Scope: the graph rooted at the CLI, which is exactly what OpenHID publishes to
# crates.io. The app crates (gui/agent) are not covered; auditing their broader
# native UI graph remains a separate policy decision.
# The `allow-git` list below is written for that wider graph and is therefore
# unmatched today — kept so widening the scope is a policy decision, not an
# archaeology exercise.
#
# Run locally with the same scope CI uses:
#   cargo deny --config .cargo/deny.toml --all-features \
#     --manifest-path crates/openhid/Cargo.toml check
#   nix run nixpkgs#cargo-deny -- --config .cargo/deny.toml --all-features \
#     --manifest-path crates/openhid/Cargo.toml check
#   cargo xtask ci cargo-deny

[advisories]
yanked = "deny"

[licenses]
# Additions here need a conscious decision; keep the list to what the graph
# actually pulls in.
allow = [
    "0BSD",
    "CDLA-Permissive-2.0",
    "MIT",
    "Apache-2.0",
    "Apache-2.0 WITH LLVM-exception",
    "BSD-2-Clause",
    "BSD-3-Clause",
    "ISC",
    "Zlib",
    "Unicode-3.0",
    "MPL-2.0",
    "CC0-1.0",
]

[bans]
# The GPUI tree carries duplicate dependency versions; keep this advisory
# rather than blocking.
multiple-versions = "warn"

[sources]
unknown-registry = "deny"
unknown-git = "deny"
# The deliberate direct git deps — everything
# that appears as `git+…` in Cargo.lock must be listed here.
allow-git = [
    "https://github.com/AprilNEA/appicon",
    "https://github.com/AprilNEA/gpui-kit",
    "https://github.com/longbridge/gpui-kit",
]
