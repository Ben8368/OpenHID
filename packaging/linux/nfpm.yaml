# nfpm package descriptor for OpenHID Linux packages (.deb / .rpm / .pkg.tar.zst).
#
# Build with the xtask:
#   cargo run -p xtask -- linux package
#
# Or directly (requires nfpm in PATH; set VERSION and PKG_ARCH):
#   VERSION=0.6.0 PKG_ARCH=amd64 nfpm package --packager deb --target target/release
#   VERSION=0.6.0 PKG_ARCH=arm64 nfpm package --packager rpm --target target/release
#   VERSION=0.6.0 PKG_ARCH=amd64 nfpm package --packager archlinux --target target/release

name: openhid
version: "${VERSION}"
arch: "${PKG_ARCH}"
maintainer: OpenHID contributors
description: |-
  Logitech HID++ device control — remap buttons, DPI, and SmartShift.
  An open-source, local-first alternative to Logi Options+. No account,
  no telemetry; configuration lives in a plain TOML file.
homepage: https://github.com/Ben8368/OpenHID
license: Apache-2.0 OR MIT

contents:
  # ── binaries ────────────────────────────────────────────────────────────────
  - src: target/release/openhid
    dst: /usr/bin/openhid
    file_info:
      mode: 0755

  - src: target/release/openhid-desktop
    dst: /usr/bin/openhid-desktop
    file_info:
      mode: 0755

  - src: target/release/openhid-overlay
    dst: /usr/bin/openhid-overlay
    file_info:
      mode: 0755

  - src: target/release/openhid-agent
    dst: /usr/bin/openhid-agent
    file_info:
      mode: 0755

  # ── udev rules ──────────────────────────────────────────────────────────────
  - src: packaging/linux/udev/70-openhid.rules
    dst: /etc/udev/rules.d/70-openhid.rules
    file_info:
      mode: 0644

  # ── systemd user unit ───────────────────────────────────────────────────────
  - src: packaging/linux/systemd/openhid-agent.service
    dst: /usr/lib/systemd/user/openhid-agent.service
    file_info:
      mode: 0644

  # ── XDG desktop entry ───────────────────────────────────────────────────────
  - src: packaging/linux/desktop/openhid.desktop
    dst: /usr/share/applications/openhid.desktop
    file_info:
      mode: 0644

  # ── icon ────────────────────────────────────────────────────────────────────
  # Every standard indexed hicolor size, not just the 1024 master: a stock
  # `hicolor/index.theme` stops at 512x512, so a launcher that resolves icons
  # by theme index (KDE's kbuildsycoca, most GTK launchers) finds nothing at
  # all when only `1024x1024/apps` is installed.
  - src: design/icon/openhid.png
    dst: /usr/share/icons/hicolor/1024x1024/apps/openhid.png
    file_info:
      mode: 0644
  - src: design/icon/openhid-512.png
    dst: /usr/share/icons/hicolor/512x512/apps/openhid.png
    file_info:
      mode: 0644
  - src: design/icon/openhid-256.png
    dst: /usr/share/icons/hicolor/256x256/apps/openhid.png
    file_info:
      mode: 0644
  - src: design/icon/openhid-128.png
    dst: /usr/share/icons/hicolor/128x128/apps/openhid.png
    file_info:
      mode: 0644
  - src: design/icon/openhid-64.png
    dst: /usr/share/icons/hicolor/64x64/apps/openhid.png
    file_info:
      mode: 0644
  - src: design/icon/openhid-48.png
    dst: /usr/share/icons/hicolor/48x48/apps/openhid.png
    file_info:
      mode: 0644
  - src: design/icon/openhid-32.png
    dst: /usr/share/icons/hicolor/32x32/apps/openhid.png
    file_info:
      mode: 0644
  - src: design/icon/openhid-16.png
    dst: /usr/share/icons/hicolor/16x16/apps/openhid.png
    file_info:
      mode: 0644

  - src: LICENSE-APACHE
    dst: /usr/share/licenses/openhid/LICENSE-APACHE
    file_info:
      mode: 0644

  - src: LICENSE-MIT
    dst: /usr/share/licenses/openhid/LICENSE-MIT
    file_info:
      mode: 0644

  - src: NOTICE
    dst: /usr/share/licenses/openhid/NOTICE
    file_info:
      mode: 0644
  - src: crates/openhid-hidpp/LICENSE
    dst: /usr/share/licenses/openhid/LICENSE-HIDPP
    file_info:
      mode: 0644

archlinux:
  packager: "OpenHID contributors"

overrides:
  deb:
    depends:
      - libxkbcommon0
      - libxkbcommon-x11-0
      - libxcb1
  archlinux:
    depends:
      - dbus
      - fontconfig
      - gcc-libs
      - glibc
      - libglvnd
      - libxcb
      - libxkbcommon
      - libxkbcommon-x11
      - vulkan-icd-loader
      - wayland

scripts:
  postinstall: packaging/linux/nfpm-scripts/postinstall.sh
  postremove: packaging/linux/nfpm-scripts/postremove.sh
