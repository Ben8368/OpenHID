version: 2

updates:
  - package-ecosystem: github-actions
    directory: /
    labels: ["dependencies", "github_actions"]
    schedule:
      interval: weekly
      day: monday
      time: "09:00"
      timezone: Asia/Shanghai
    open-pull-requests-limit: 5
    cooldown:
      default-days: 7
    groups:
      actions-compatible:
        patterns: ["*"]
        update-types: [minor, patch]
    commit-message:
      prefix: ci
      include: scope

  - package-ecosystem: cargo
    directory: /
    labels: ["dependencies", "rust"]
    # bincode 3.0.0 is the project's terminal "unmaintained" release: its
    # lib.rs contains only `compile_error!`. Runtime IPC uses bincode 1.3
    # through tokio-serde 0.9, and openhid-ipc mirrors that version for the
    # wire-format goldens, so the 3.x line has no upgrade target.
    ignore:
      - dependency-name: "bincode"
        versions: [">=3.0.0, <4.0.0"]
    schedule:
      interval: weekly
      day: monday
      time: "09:15"
      timezone: Asia/Shanghai
    open-pull-requests-limit: 5
    cooldown:
      default-days: 7
    groups:
      rust-compatible:
        patterns: ["*"]
        update-types: [minor, patch]
    commit-message:
      prefix: build
      include: scope

  - package-ecosystem: npm
    directory: /.github/scripts/release-notes
    labels: ["dependencies"]
    schedule:
      interval: weekly
      day: monday
      time: "09:30"
      timezone: Asia/Shanghai
    open-pull-requests-limit: 3
    cooldown:
      default-days: 7
    groups:
      release-tools-compatible:
        patterns: ["*"]
        update-types: [minor, patch]
    commit-message:
      prefix: build
      include: scope

  - package-ecosystem: pip
    directory: /.github/scripts/governance
    labels: ["dependencies"]
    schedule:
      interval: monthly
      time: "09:45"
      timezone: Asia/Shanghai
    open-pull-requests-limit: 2
    cooldown:
      default-days: 7
    commit-message:
      prefix: ci
      include: scope
